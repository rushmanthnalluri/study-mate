name: Dependency refresh

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'chore(deps): refresh lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Capture npm audit report
        run: |
          mkdir -p docs/security
          npm audit --json > docs/security/npm-audit.json || true

      - name: Commit dependency resolution
        run: |
          git config user.name "Rushmanth Nalluri"
          git config user.email "2500030215@kluniversity.in"
          git add package-lock.json docs/security/npm-audit.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(deps): refresh lockfile"
          git push
